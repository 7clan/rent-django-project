services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rent_api
      POSTGRES_USER: rent_api
      POSTGRES_PASSWORD: rent_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rent_api -d rent_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: rent_api
      POSTGRES_USER: rent_api
      POSTGRES_PASSWORD: rent_api
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
